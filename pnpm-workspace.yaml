packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@hey-api/client-fetch": ^0.13.1
  "@hey-api/openapi-ts": 0.99.0
  "@orama/tokenizers": ^3.1.18
  "@types/node": ^26
  "@types/react-big-calendar": ^1.16.3
  "@uidotdev/usehooks": ^2.4.1
  babel-plugin-react-compiler: ^1.0.0
  date-fns: ^4.4.0
  execa: ^10.0.1
  i18next: ^26.3.6
  i18next-resources-to-backend: ^1.2.3
  immer: ^11.1.15
  jspdf: ^4.2.1
  jspdf-autotable: ^5.0.8
  lucide-react: ^1.27.0
  motion: ^12.43.0
  polished: ^4.3.1
  react: ^18.3.1
  react-big-calendar: ^1.20.0
  react-compiler-runtime: ^1.0.0
  react-grab: ^0.1.50
  react-hook-form: ^7.84.0
  react-i18next: ^17.0.11
  react-markdown: ^10.1.0
  sharp: ^0.35.3
  sonner: ^2.0.7
  typescript: ^7
  vite: npm:@voidzero-dev/vite-plus-core@0.1.18
  vite-plugin-pwa: ^1.3.0
  vite-plus: 0.1.18
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.18
  workbox-background-sync: ^7.4.1
  workbox-build: ^7.4.1
  workbox-core: ^7.4.1
  workbox-expiration: ^7.4.1
  workbox-precaching: ^7.4.1
  workbox-routing: ^7.4.1
  workbox-strategies: ^7.4.1
  workbox-window: ^7.4.1
  zustand: ^5.0.14

catalogMode: prefer
# pnpm 10 no longer reads the "pnpm" field in package.json, so every override
# lives here. The react/react-dom pins must track the apps' declared versions:
# when they drifted apart, react resolved to 19.2.7 against react-dom 19.2.8 and
# the app died on boot with "Incompatible React versions", taking the whole e2e
# suite with it.
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  react: ^19.2.8
  react-dom: ^19.2.8
  dompurify: ^3.4.1
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  serialize-javascript: ^7.0.5
  brace-expansion@1: ^1.1.13
  picomatch@4: ^4.0.4
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
