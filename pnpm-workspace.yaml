packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@hey-api/client-fetch": ^0.13.1
  "@hey-api/openapi-ts": 0.99.0
  "@orama/tokenizers": ^3.1.18
  "@types/node": ^26.6.5
  "@types/react-big-calendar": ^1.16.3
  "@uidotdev/usehooks": ^2.4.1
  babel-plugin-react-compiler: ^1.0.0
  date-fns: ^4.4.0
  execa: ^10.2.1
  i18next: ^26.5.10
  i18next-resources-to-backend: ^1.2.3
  immer: ^11.2.9
  jspdf: ^4.2.1
  jspdf-autotable: ^5.0.9
  lucide-react: ^1.61.0
  motion: ^14.6.0
  polished: ^4.3.1
  react: ^19.3.1
  react-big-calendar: ^1.20.0
  react-compiler-runtime: ^1.0.0
  react-grab: ^0.2.0
  react-hook-form: ^7.91.0
  react-i18next: ^17.1.8
  react-markdown: ^10.1.0
  sharp: ^0.35.5
  sonner: ^2.0.8
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plugin-pwa: ^2.0.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  workbox-background-sync: ^7.4.1
  workbox-build: ^7.4.1
  workbox-core: ^7.4.1
  workbox-expiration: ^7.4.1
  workbox-precaching: ^7.4.1
  workbox-routing: ^7.4.1
  workbox-strategies: ^7.4.1
  workbox-window: ^7.4.1
  zustand: ^5.0.16

catalogMode: prefer
# pnpm 10 no longer reads the "pnpm" field in package.json, so every override
# lives here. The react/react-dom pins must track the apps' declared versions:
# when they drifted apart, react resolved to 19.2.7 against react-dom 19.2.8 and
# the app died on boot with "Incompatible React versions", taking the whole e2e
# suite with it.
overrides:
  js-yaml@4: ^4.3.2
  seroval: ^1.7.2
  compression: ^1.8.2
  # Typography pins 6.0.10; its parser API is compatible with the security-fixed 7.x.
  postcss-selector-parser: ^7.1.6
  undici@7: ^7.30.1
  brace-expansion@1: ^1.1.21
  dompurify: ^3.4.17
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  picomatch@4: ^4.0.4
  react: ^19.3.1
  react-dom: ^19.3.1
  serialize-javascript: ^7.1.3
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
