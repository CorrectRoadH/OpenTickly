name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      nightly:
        description: Report the result as a Nightly release
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a release tag
        env:
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Dispatch this workflow on a v* release tag"
            exit 1
          fi
          if [[ "$NIGHTLY" == true && "$GITHUB_REF_NAME" != *-nightly.* ]]; then
            echo "::error::Use a Nightly tag when nightly is true"
            exit 1
          fi

  full-tests:
    needs: validate-ref
    permissions:
      contents: read
    uses: ./.github/workflows/full-tests.yml

  build-and-push:
    needs: full-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require Sentry upload credential
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Configure SENTRY_AUTH_TOKEN before publishing production assets"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: "!contains(github.ref_name, '-nightly.')"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            correctroad/opentoggl
            correctroad/opentickly
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Extract nightly metadata
        if: contains(github.ref_name, '-nightly.')
        id: nightly-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            correctroad/opentoggl
            correctroad/opentickly
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=nightly

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.nightly-meta.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.nightly-meta.outputs.labels || steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            OPENTOGGL_VERSION=${{ github.ref_name }}

  # The built frontend is arch-independent static JS, so build it once here
  # instead of repeating it in every leg of the build-binary arch matrix.
  build-frontend:
    needs: full-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require Sentry upload credential
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Configure SENTRY_AUTH_TOKEN before publishing production assets"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          version: "1.7.0"
          run-install: false
          cache: true

      - name: Build frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          vp install --filter opentoggl --filter @opentickly/website... --frozen-lockfile --ignore-scripts
          vp run website#build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: apps/website/dist
          retention-days: 1
          if-no-files-found: error

  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: apps/backend/internal/web/dist

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" \
            -o opentoggl-linux-${{ matrix.goarch }} ./apps/backend

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goarch }}
          path: opentoggl-linux-${{ matrix.goarch }}
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build-and-push, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -s release-assets/opentoggl-linux-amd64
          test -s release-assets/opentoggl-linux-arm64

      - name: Generate changelog from commits
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          prerelease: ${{ contains(github.ref_name, '-nightly.') }}
          make_latest: ${{ contains(github.ref_name, '-nightly.') && 'false' || '' }}
          body: ${{ steps.changelog.outputs.content }}
          fail_on_unmatched_files: true
          files: |
            release-assets/opentoggl-linux-amd64
            release-assets/opentoggl-linux-arm64

  report:
    if: >-
      always() && inputs.nightly &&
      (contains(needs.*.result, 'failure') || needs.release.result == 'success')
    needs: [validate-ref, full-tests, build-and-push, build-frontend, build-binary, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NIGHTLY_FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - name: Update Nightly failure issue
        run: |
          set -euo pipefail

          title='Nightly release failing'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue=$(gh api --paginate --slurp "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq 'map(.[]) | map(select(.title == "Nightly release failing" and .pull_request == null)) | first | .number // empty')

          if [[ "$NIGHTLY_FAILED" == true ]]; then
            body="Nightly release failed: $run_url"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Nightly release passed: $run_url"
          fi
