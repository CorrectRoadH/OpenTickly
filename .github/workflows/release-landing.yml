name: Release landing

# Push release: build the landing runtime image, push it to GHCR and ask the
# self-hosted app-deployer to roll it out. This is the only landing release path.
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: landing-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: CorrectRoadH/app-release-action@3243a2aea8a61686a8ae5a7c314e626f80ea2cde
        with:
          app: opentoggl-saas
          image-prefix: ghcr.io/correctroadh/opentickly
          platform: linux/arm64
          tailscale-client-id: ${{ vars.APP_RELEASE_TS_CLIENT_ID }}
          tailscale-audience: ${{ vars.APP_RELEASE_TS_AUDIENCE }}
          deployer-url: ${{ vars.APP_RELEASE_DEPLOYER_URL }}
          components: |
            - name: landing
              dockerfile: apps/landing/Dockerfile
              target: runtime
              build-args: |
                SOURCE_SHA=${{ github.sha }}
