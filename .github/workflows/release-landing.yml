name: Release online services

# Build landing and demo once, upload their sourcemaps, and deploy those images.
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/website/**"
      - "apps/backend/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi/**"
      - "packages/**"
      - "tools/sentry-build.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-landing.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building and uploading sourcemaps
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: landing-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require Sentry upload credential
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Configure SENTRY_AUTH_TOKEN before publishing production assets"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: release
        uses: CorrectRoadH/app-release-action@cd93be25b555447000877d481a14fc01989bb2a9
        with:
          deploy: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
          app: opentoggl-saas
          image-prefix: ghcr.io/correctroadh/opentickly
          platform: linux/arm64
          tailscale-client-id: ${{ vars.APP_RELEASE_TS_CLIENT_ID }}
          tailscale-audience: ${{ vars.APP_RELEASE_TS_AUDIENCE }}
          deployer-url: ${{ vars.APP_RELEASE_DEPLOYER_URL }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          components: |
            - name: landing
              dockerfile: apps/landing/Dockerfile
              target: runtime
              build-args: |
                SOURCE_SHA=${{ github.sha }}
            - name: demo
              dockerfile: Dockerfile
              target: release
              build-args: |
                SOURCE_SHA=${{ github.sha }}
      - name: Record healthy deployment in Sentry
        if: steps.release.outputs.status == 'healthy'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for target in opentickly-landing:landing opentickly-demo:api opentickly-demo:web; do
            project="${target%:*}"
            version="${target#*:}@${GITHUB_SHA}"
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null \
              --request POST "https://sentry.io/api/0/organizations/instaai/releases/" \
              --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"version\":\"${version}\",\"projects\":[\"${project}\"],\"ref\":\"${GITHUB_SHA}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\"}"
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null \
              --request POST "https://sentry.io/api/0/organizations/instaai/releases/${version}/deploys/" \
              --header "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"environment\":\"production\",\"projects\":[\"${project}\"],\"name\":\"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          done
