name: Build and Push Landing Image

# Manual recovery packaging for the previous k3s image channel.
# Automatic delivery is owned by release-landing.yml / deploy-landing.yml.
# Keep the image/tag/build settings available for an explicitly coordinated rollback.
on:
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_LANDING_IMAGE: correctroadh/opentickly-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_LANDING_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.landing
          platforms: linux/arm64
          push: true
          # Push a plain single-arch image manifest, not an OCI index with a
          # provenance/SBOM attestation. argocd-image-updater's `newest-build`
          # strategy reads the config `created` timestamp to pick the latest
          # image; it cannot traverse an attestation-bearing index, so with
          # attestations on it never detects new sha-* tags and the landing
          # deploy silently goes stale. Keep these off so GitOps auto-updates.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
