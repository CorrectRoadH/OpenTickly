name: Nightly

on:
  schedule:
    - cron: "18 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the nightly release
        id: tag
        run: |
          set -euo pipefail

          tags=$(git tag --list 'v*')
          previous=$(awk '/^v[0-9]+[.][0-9]+[.][0-9]+-nightly[.][0-9]+$/ {
            split($0, parts, "[.]")
            if (parts[4] + 0 > run) {
              run = parts[4] + 0
              tag = $0
            }
          } END { print tag }' <<< "$tags")

          if [[ -n "$previous" && "$(git rev-parse "$previous^{commit}")" == "$GITHUB_SHA" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname --list 'v*' |
            awk '/^v[0-9]+[.][0-9]+[.][0-9]+$/ && !found { print; found = 1 }')
          if [[ -z "$stable" ]]; then
            echo "::error::No stable vMAJOR.MINOR.PATCH tag is reachable from $GITHUB_SHA"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${stable#v}"
          tag="v${major}.${minor}.$((patch + 1))-nightly.${GITHUB_RUN_NUMBER}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          {
            echo 'skip=false'
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Dispatch Docker release
        run: gh workflow run docker.yml --ref "$NIGHTLY_TAG" -f nightly=true
